services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-requirement_dashboard}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-requirement_dashboard}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_EXPIRES: 1h
      JWT_REFRESH_EXPIRES: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      UPLOAD_DIR: /app/server/uploads
      MAX_UPLOAD_MB: 10
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/server/uploads
    ports:
      - '${API_PORT:-4000}:4000'

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '${CLIENT_PORT:-8081}:80'

volumes:
  pg_data:
  uploads:
