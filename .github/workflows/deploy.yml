name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/delphic
            git pull origin main
            chmod +x start-delphic.sh setup-vm.sh
            ./start-delphic.sh --prod --no-boot
            curl -sf http://127.0.0.1:4000/api/v1/health | grep -q '"status":"ok"'

      - name: Deploy disabled notice
        if: ${{ vars.DEPLOY_ENABLED != 'true' }}
        run: echo "Set repository variable DEPLOY_ENABLED=true and configure VPS_HOST/VPS_USER/VPS_SSH_KEY secrets to enable deployment."
